<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extreme Demon List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Extreme Demon List</h1>

<table id="list">
<tr><th>Rank</th><th>Level</th><th>Points</th></tr>
</table>

<a href="submit.html">Submit Record</a> |
<a href="leaderboard.html">Leaderboard</a>

<script>
fetch("/api/list")
.then(r=>r.json())
.then(data=>{
  data.levels.filter(l=>!l.archived).forEach(l=>{
    list.innerHTML += `
      <tr>
        <td>#${l.rank}</td>
        <td>${l.name}</td>
        <td>${l.points}</td>
      </tr>`;
  });
});
</script>
</body>
</html>
