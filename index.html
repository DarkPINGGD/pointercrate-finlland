<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extreme Demon List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Extreme Demon List</h1>

<table id="list">
<tr><th>Rank</th><th>Level</th><th>Points</th></tr>
</table>

<a href="submit.html">Submit</a> |
<a href="leaderboard.html">Leaderboard</a>

<script>
function calc(rank){
  return rank>150?0:Math.round(Math.pow(1-(rank-1)/150,2)*100);
}

fetch("/api/list")
.then(r=>r.json())
.then(data=>{
  data.levels
  .filter(l=>!l.archived)
  .sort((a,b)=>a.rank-b.rank)
  .forEach(l=>{
    list.innerHTML+=`
      <tr>
        <td>#${l.rank}</td>
        <td>${l.name}</td>
        <td>${calc(l.rank)}</td>
      </tr>`;
  });
});
</script>

</body>
</html>
