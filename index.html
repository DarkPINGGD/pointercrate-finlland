<!DOCTYPE html>
<html>
<head>
  <title>Extreme Demon List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>Extreme Demon List</header>

<table id="list">
  <tr>
    <th>Rank</th>
    <th>Level</th>
    <th>Creator</th>
    <th>Points</th>
  </tr>
</table>

<section style="width:92%;margin:auto">
  <h2>Submit Record (100%)</h2>
  <input id="player" placeholder="Player name">
  <input id="level" placeholder="Exact level name">
  <br>
  <button onclick="submit()">Submit</button>
</section>

<script src="script.js"></script>
</body>
</html>
