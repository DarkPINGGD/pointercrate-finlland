<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extreme Demon List</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">

<h1>Extreme Demon List</h1>

  <div class="layout">
  <aside class="sidebar left">
    <h3>Extreme Demon List</h3>
    <p>Created By: <b>DARKPINGGD</b></p>
    <p>Hardest in Finland: <b>andromeda</b></p>
    <p>Version: <b></b></p>
  </aside>

  <main class="content">
    <!-- pc-wrapper buraya -->
  </main>
</div>


<nav id="fixedNav">
  <a href="index.html">LIST</a>
  <a href="leaderboard.html">LEADERBOARD</a>
  <a href="submit.html">SUBMIT</a>
  <a href="admin-login.html">ADMIN</a>
</nav>


<table id="list">
  <tr>
    <th class="rank">#</th>
    <th>Level</th>
    <th class="points">Points</th>
  </tr>
  <table class="pc-table">
<tr>
  <th>#</th>
  <th>Level</th>
  <th>Creator</th>
  <th>Verifier</th>
  <th>Victors</th>
  <th>Points</th>
  <th>Video</th>
</tr>

</table>

</div>

<script>
function calc(rank){
  return rank > 150 ? 0 :
    Math.round(Math.pow(1 - (rank - 1) / 150, 2) * 100);
}

fetch("/api/list")
.then(r => r.json())
.then(data => {
  data.levels
    .filter(l => !l.archived)
    .sort((a,b)=>a.rank-b.rank)
    .forEach(l => {
      list.innerHTML += `
        <tr>
          <td class="rank">${l.rank}</td>
          <td>${l.name}</td>
          <td class="points">${calc(l.rank)}</td>
        </tr>`;
      <td>
  <strong>Slaughterhouse</strong><br>
  <span class="sub">by icedcave</span>
</td>

    });
});
</script>
</body>

</html>
