<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extreme Demon List</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">

<h1>Extreme Demon List</h1>

<nav>
  <a href="index.html">List</a>
  <a href="leaderboard.html">Leaderboard</a>
  <a href="submit.html">Submit</a>
  <a href="admin.html">Admin</a>
</nav>

<table id="list">
  <tr>
    <th class="rank">#</th>
    <th>Level</th>
    <th class="points">Points</th>
  </tr>
  <table class="pc-table">
<tr>
  <th>#</th>
  <th>Level</th>
  <th>Creator</th>
  <th>Verifier</th>
  <th>Victors</th>
  <th>Points</th>
  <th>Video</th>
</tr>

</table>

</div>

<script>
function calc(rank){
  return rank > 150 ? 0 :
    Math.round(Math.pow(1 - (rank - 1) / 150, 2) * 100);
}

fetch("/api/list")
.then(r => r.json())
.then(data => {
  data.levels
    .filter(l => !l.archived)
    .sort((a,b)=>a.rank-b.rank)
    .forEach(l => {
      list.innerHTML += `
        <tr>
          <td class="rank">${l.rank}</td>
          <td>${l.name}</td>
          <td class="points">${calc(l.rank)}</td>
        </tr>`;
    });
});
</script>
</body>

</html>
