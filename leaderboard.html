<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Leaderboard</h1>

<table id="board">
<tr><th>Player</th><th>Country</th><th>Points</th></tr>
</table>

<script>
fetch("/api/list")
.then(r=>r.json())
.then(data=>{
  const map = {};
  data.records.filter(r=>r.approved).forEach(r=>{
    if(!map[r.player]) map[r.player]={points:0,country:r.country};
    map[r.player].points += r.points;
  });

  Object.entries(map)
  .sort((a,b)=>b[1].points-a[1].points)
  .forEach(p=>{
    board.innerHTML += `
      <tr>
        <td><a href="player.html?name=${p[0]}">${p[0]}</a></td>
        <td>${p[1].country}</td>
        <td>${p[1].points}</td>
      </tr>`;
  });
});
</script>
</body>
</html>
