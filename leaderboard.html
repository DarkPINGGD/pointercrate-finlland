<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

<h1>Leaderboard</h1>

<nav>
  <a href="index.html">List</a>
</nav>

<table id="board">
  <tr>
    <th class="rank">#</th>
    <th>Player</th>
    <th>Country</th>
    <th>Points</th>
  </tr>
</table>

</div>

<script>
fetch("/api/list")
.then(r=>r.json())
.then(data=>{
  const map = {};

  data.records.filter(r=>r.approved).forEach(r=>{
    if(!map[r.player])
      map[r.player]={points:0,country:r.country};
    map[r.player].points+=r.points;
  });

  Object.entries(map)
  .sort((a,b)=>b[1].points-a[1].points)
  .forEach((p,i)=>{
    board.innerHTML+=`
      <tr>
        <td class="rank">${i+1}</td>
        <td><a href="player.html?name=${p[0]}">${p[0]}</a></td>
        <td>${p[1].country}</td>
        <td>${p[1].points}</td>
      </tr>`;
  });
});
</script>
</body>
</html>
