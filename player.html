<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pc-wrapper">
  <h1 id="playerName"></h1>
  <div class="layout">
  <aside class="sidebar left">
    <h3>Extreme Demon List</h3>
    <p>Total Levels: <b>75</b></p>
    <p>Hardest: <b>Slaughterhouse</b></p>
    <p>Updated: <b>2025-01-10</b></p>
  </aside>

  <main class="content">
    <!-- pc-wrapper buraya -->
  </main>
</div>


  <table class="pc-table">
    <tr>
      <th>Level</th>
      <th>Rank</th>
      <th>Points</th>
      <th>Video</th>
    </tr>
  </table>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const player = params.get("name");

document.getElementById("playerName").textContent = player;

fetch("/api/list")
.then(r=>r.json())
.then(data=>{
  const table = document.querySelector(".pc-table");

  data.records.forEach(l=>{
    if(l.victors && l.victors.includes(player)){
      table.innerHTML += `
        <tr>
          <td>${l.name}</td>
          <td>#${l.rank}</td>
          <td>${l.points.toFixed(2)}</td>
          <td><a href="${l.video}" target="_blank">link</a></td>
        </tr>
      `;
    }
  });
});
</script>

</body>
</html>
