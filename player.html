<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Player</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

<h1 id="name"></h1>
<ul id="list"></ul>
<p id="total"></p>

<script>
const name=new URLSearchParams(location.search).get("name");
document.getElementById("name").textContent=name;

let total=0;

fetch("/api/list")
.then(r=>r.json())
.then(data=>{
  data.records
  .filter(r=>r.approved && r.player===name)
  .forEach(r=>{
    total+=r.points;
    list.innerHTML+=`<li>#${r.rank} ${r.level} (${r.points} pts)</li>`;
  });
  total.textContent="Total Points: "+total;
});
</script>
</body>
</html>
