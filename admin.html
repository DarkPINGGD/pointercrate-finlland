<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>
if(!localStorage.getItem("admin")){
  location.href="admin-login.html";
}
</script>

<h1>Pending Records</h1>

<table id="table">
<tr>
<th>Player</th>
<th>Level</th>
<th>Rank</th>
<th>Points</th>
<th>Video</th>
<th>Action</th>
</tr>
</table>

<script>
fetch("/api/list")
.then(r=>r.json())
.then(d=>{
  d.records.filter(r=>!r.approved).forEach((r,i)=>{
    table.innerHTML+=`
    <tr>
      <td>${r.player}</td>
      <td>${r.level}</td>
      <td>#${r.rank}</td>
      <td>${r.points}</td>
      <td><a href="${r.video}" target="_blank">link</a></td>
      <td>
        <button onclick="approve(${i})">✔</button>
        <button onclick="reject(${i})">✖</button>
      </td>
    </tr>`;
  });
});

function approve(i){
  fetch("/api/approve",{method:"POST",body:JSON.stringify({i})})
  .then(()=>location.reload());
}
function reject(i){
  fetch("/api/reject",{method:"POST",body:JSON.stringify({i})})
  .then(()=>location.reload());
}
</script>

</body>
</html>
